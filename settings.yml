default_thumbnail_mode:
  default: feed
  type: enum
  choices:
    - minimal-grid
    - grid
    - masonry
    - list
    - blog-style
    - feed
    - none

docs_thumbnail_mode:
  default: none
  type: enum
  choices:
    - minimal-grid
    - grid
    - list
    - blog-style
    - feed
    - none

blog_style_categories:
  type: list
  list_type: category
  default: ""

minimal_grid_categories:
  type: list
  list_type: category
  default: ""

grid_categories:
  type: list
  list_type: category
  default: ""

masonry_categories:
  type: list
  list_type: category
  default: ""

list_categories:
  type: list
  list_type: category
  default: ""

blog_style_tags:
  type: list
  list_type: tag
  default: ""

feed_categories:
  type: list
  list_type: category
  default: ""

feed_tags:
  type: list
  list_type: tag
  default: ""

minimal_grid_tags:
  type: list
  list_type: tag
  default: ""

grid_tags:
  type: list
  list_type: tag
  default: ""

masonry_tags:
  type: list
  list_type: tag
  default: ""

list_tags:
  type: list
  list_type: tag
  default: ""

suggested_topics_mode:
  default: ""
  type: enum
  choices:
    - ""
    - minimal-grid
    - grid
    - masonry
    - list
    - blog-style
    - feed
    - none

enable_outside_topic_lists: false

placeholder_icon:
  default: "comments"

mobile_thumbnails:
  default: true

list_thumbnail_size:
  client: true
  default: 200
  type: enum
  choices:
    - 200
    - 400

# 可滑动分类导航设置
show_scrolling_category_nav:
  default: true
  type: bool

scrolling_nav_categories:
  type: list
  list_type: category
  default: ""

scrolling_nav_show_on_mobile:
  default: true
  type: bool

hero_carousel_enabled:
  default: false
  type: bool

hero_carousel_interval_seconds:
  default: 6
  type: integer
  client: true

hero_carousel_slides:
  type: objects
  default: []
  client: true
  schema:
    name: slide
    properties:
      background_image_url:
        type: string
      character_image_url:
        type: string
      # 位置/尺寸可选；统一 right + bottom + height（宽度自适应），空则用 CSS 默认
      # 默认（对照设计稿）：人物 right 50% / bottom 0 / height 100%；文案 right 3% / bottom 14% / height 50%
      character_right:
        type: string
      character_bottom:
        type: string
      character_height:
        type: string
      copy_image_url:
        type: string
      copy_right:
        type: string
      copy_bottom:
        type: string
      copy_height:
        type: string
      panel_title:
        type: string
      link_url:
        type: string
      alt_text:
        type: string

# 维护模式设置
maintenance_mode_enabled:
  default: false
  type: bool

maintenance_mode_image:
  type: upload
  default: ""

maintenance_mode_title:
  default: "敬请期待"
  type: string
  client: true

maintenance_mode_description:
  default: "我们正在努力开发中，请稍后再来！"
  type: string
  client: true

# 年龄验证设置
age_verification_enabled:
  default: false
  type: bool

age_verification_excluded_paths:
  default: "/verify|/auth/login?return_to=|/auth/sso-error|/auth/"
  type: string
  client: true

age_verification_reject_url:
  default: "https://cdn.ibomy.com/forum/images/age_verify/r18.html"
  type: string
  client: true

age_verification_interval_seconds:
  default: 86400
  type: integer
  client: true

mobile_inline_search_enabled:
  default: true
  type: bool
  client: true

mobile_inline_search_hot_items:
  type: objects
  default: []
  client: true
  schema:
    name: hot_item
    properties:
      title:
        type: string
      link_url:
        type: string
      badge:
        type: string
      badge_color:
        type: string
      badge_bg_color:
        type: string

mobile_inline_search_discovery_items:
  type: objects
  default:
    - title: 小波健身
      link_url: "/search?q=小波健身"
    - title: 私藏
      link_url: "/search?q=私藏"
    - title: 交感神经和副交感神经
      link_url: "/search?q=交感神经和副交感神经"
    - title: 大手拉小手
      link_url: "/search?q=大手拉小手"
  client: true
  schema:
    name: discovery_item
    properties:
      title:
        type: string
      link_url:
        type: string
